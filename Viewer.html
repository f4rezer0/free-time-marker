<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viewer - Free Time Marker</title>
  <?!= include('Stylesheet'); ?>
</head>
<body class="dashboard">
  <nav class="navbar">
    <h1>🕒 Free Time Marker - Visualizzazione Presenze</h1>
    <div class="navbar-user">
      <span id="userInfo"></span>
      <button class="btn-logout" onclick="logout()">Esci</button>
    </div>
  </nav>

  <div class="container">
    <!-- Statistics Cards (Read-only) -->
    <div class="stats-grid">
      <div class="stat-card">
        <h3>Timbrature Oggi</h3>
        <div class="stat-value" id="statOggi">-</div>
      </div>
      <div class="stat-card">
        <h3>Timbrature Mese</h3>
        <div class="stat-value" id="statMese">-</div>
      </div>
      <div class="stat-card">
        <h3>Dipendenti Attivi</h3>
        <div class="stat-value" id="statDipendenti">-</div>
      </div>
      <div class="stat-card">
        <h3>Totale Timbrature</h3>
        <div class="stat-value" id="statTotale">-</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="showTab('presenze')">📋 Presenze</button>
      <button class="tab" onclick="showTab('dipendenti')">👥 Dipendenti</button>
      <button class="tab" onclick="showTab('turni')">🕐 Turni</button>
    </div>

    <!-- TAB: Presenze -->
    <div id="tab-presenze" class="tab-content active">
      <div class="card">
        <div class="card-header">
          <h2>Registro Presenze</h2>
        </div>

        <div class="filter-group">
          <select id="filterAnno" onchange="loadPresenze()">
            <option value="">Tutti gli anni</option>
          </select>
          <select id="filterMese" onchange="loadPresenze()">
            <option value="">Tutti i mesi</option>
            <option value="1">Gennaio</option>
            <option value="2">Febbraio</option>
            <option value="3">Marzo</option>
            <option value="4">Aprile</option>
            <option value="5">Maggio</option>
            <option value="6">Giugno</option>
            <option value="7">Luglio</option>
            <option value="8">Agosto</option>
            <option value="9">Settembre</option>
            <option value="10">Ottobre</option>
            <option value="11">Novembre</option>
            <option value="12">Dicembre</option>
          </select>
          <select id="filterDipendente" onchange="loadPresenze()">
            <option value="">Tutti i dipendenti</option>
          </select>
        </div>

        <div id="presenzeTable">
          <div class="loading">Caricamento...</div>
        </div>
      </div>
    </div>

    <!-- TAB: Dipendenti (Read-only) -->
    <div id="tab-dipendenti" class="tab-content">
      <div class="card">
        <div class="card-header">
          <h2>Elenco Dipendenti</h2>
          <input type="text" class="search-box" id="searchDipendenti" placeholder="🔍 Cerca dipendente..." oninput="filterDipendenti()">
        </div>

        <div id="dipendentiTable">
          <div class="loading">Caricamento...</div>
        </div>
      </div>
    </div>

    <!-- TAB: Turni (Read-only) -->
    <div id="tab-turni" class="tab-content">
      <div class="card">
        <div class="card-header">
          <h2>Turni Programmati</h2>
        </div>

        <div id="turniTable">
          <div class="loading">Caricamento...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let allDipendenti = [];
    let allPresenze = [];
    let allTurni = [];

    // Init
    window.onload = function() {
      const userStr = sessionStorage.getItem('user');
      if (!userStr) {
        window.location.href = '<?= ScriptApp.getService().getUrl() ?>';
        return;
      }

      currentUser = JSON.parse(userStr);
      document.getElementById('userInfo').textContent = '👤 ' + currentUser.username;

      loadStats();
      loadDipendenti();
      loadPresenze();
      loadTurni();
      populateYearFilter();
    };

    function logout() {
      sessionStorage.removeItem('user');
      window.location.href = '<?= ScriptApp.getService().getUrl() ?>';
    }

    function showTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');
    }

    // ===== STATS =====
    function loadStats() {
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.success) {
            const stats = response.stats;
            document.getElementById('statOggi').textContent = stats.timbratureOggi;
            document.getElementById('statMese').textContent = stats.timbratureMese;
            document.getElementById('statDipendenti').textContent = stats.dipendentiAttivi;
            document.getElementById('statTotale').textContent = stats.totaleTimbrature;
          }
        })
        .withFailureHandler(function(error) {
          console.error('Errore caricamento stats:', error);
        })
        .doPost({action: 'getStatistiche', ruolo: currentUser.ruolo});
    }

    // ===== DIPENDENTI (Read-only) =====
    function loadDipendenti() {
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.success) {
            allDipendenti = response.dipendenti.filter(d => d.attivo);
            renderDipendenti();
            populateDipendentiFilter();
          }
        })
        .withFailureHandler(function(error) {
          document.getElementById('dipendentiTable').innerHTML = '<p class="error-msg">Errore caricamento: ' + error.message + '</p>';
        })
        .doPost({action: 'getDipendenti', ruolo: currentUser.ruolo});
    }

    function renderDipendenti() {
      const searchTerm = document.getElementById('searchDipendenti').value.toLowerCase();
      const filtered = allDipendenti.filter(d =>
        d.nome.toLowerCase().includes(searchTerm) ||
        d.cognome.toLowerCase().includes(searchTerm) ||
        (d.reparto && d.reparto.toLowerCase().includes(searchTerm))
      );

      let html = '<table><thead><tr><th>Nome</th><th>Cognome</th><th>Reparto</th></tr></thead><tbody>';

      if (filtered.length === 0) {
        html += '<tr><td colspan="3" style="text-align: center; padding: 40px; color: #999;">Nessun dipendente trovato</td></tr>';
      } else {
        filtered.forEach(d => {
          html += `<tr>
            <td>${d.nome}</td>
            <td>${d.cognome}</td>
            <td>${d.reparto || '-'}</td>
          </tr>`;
        });
      }

      html += '</tbody></table>';
      document.getElementById('dipendentiTable').innerHTML = html;
    }

    function filterDipendenti() {
      renderDipendenti();
    }

    // ===== PRESENZE =====
    function loadPresenze() {
      const anno = document.getElementById('filterAnno').value;
      const mese = document.getElementById('filterMese').value;
      const nfcTag = document.getElementById('filterDipendente').value;

      google.script.run
        .withSuccessHandler(function(response) {
          if (response.success) {
            allPresenze = response.timbrature;
            renderPresenze();
          }
        })
        .withFailureHandler(function(error) {
          document.getElementById('presenzeTable').innerHTML = '<p class="error-msg">Errore caricamento: ' + error.message + '</p>';
        })
        .doPost({action: 'getTimbrature', anno: anno, mese: mese, nfcTag: nfcTag, ruolo: currentUser.ruolo});
    }

    function renderPresenze() {
      let html = '<table><thead><tr><th>Data e Ora</th><th>Nome</th><th>Cognome</th></tr></thead><tbody>';

      if (allPresenze.length === 0) {
        html += '<tr><td colspan="3" style="text-align: center; padding: 40px; color: #999;">Nessuna presenza registrata</td></tr>';
      } else {
        // Raggruppa per giorno
        const grouped = {};
        allPresenze.forEach(p => {
          const date = new Date(p.timestamp);
          const dayKey = date.toLocaleDateString('it-IT');
          if (!grouped[dayKey]) {
            grouped[dayKey] = [];
          }
          grouped[dayKey].push(p);
        });

        // Ordina per data decrescente
        Object.keys(grouped).sort((a, b) => {
          return new Date(b.split('/').reverse().join('-')) - new Date(a.split('/').reverse().join('-'));
        }).forEach(dayKey => {
          grouped[dayKey].forEach(p => {
            const timestamp = new Date(p.timestamp);
            html += `<tr>
              <td>${timestamp.toLocaleString('it-IT')}</td>
              <td>${p.nome}</td>
              <td>${p.cognome}</td>
            </tr>`;
          });
        });
      }

      html += '</tbody></table>';
      document.getElementById('presenzeTable').innerHTML = html;
    }

    function populateYearFilter() {
      const select = document.getElementById('filterAnno');
      const currentYear = new Date().getFullYear();
      for (let y = currentYear; y >= currentYear - 5; y--) {
        const option = document.createElement('option');
        option.value = y;
        option.textContent = y;
        select.appendChild(option);
      }
    }

    function populateDipendentiFilter() {
      const select = document.getElementById('filterDipendente');
      select.innerHTML = '<option value="">Tutti i dipendenti</option>';
      allDipendenti.forEach(d => {
        const option = document.createElement('option');
        option.value = d.nfcTag;
        option.textContent = d.nome + ' ' + d.cognome;
        select.appendChild(option);
      });
    }

    // ===== TURNI (Read-only) =====
    function loadTurni() {
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.success) {
            allTurni = response.turni;
            renderTurni();
          }
        })
        .withFailureHandler(function(error) {
          document.getElementById('turniTable').innerHTML = '<p class="error-msg">Errore caricamento: ' + error.message + '</p>';
        })
        .doPost({action: 'getTurni', ruolo: currentUser.ruolo});
    }

    function renderTurni() {
      const giorni = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];

      // Raggruppa per giorno
      const grouped = {};
      allTurni.forEach(t => {
        const day = giorni[t.giornoSettimana];
        if (!grouped[day]) {
          grouped[day] = [];
        }
        grouped[day].push(t);
      });

      let html = '';

      if (allTurni.length === 0) {
        html = '<div class="empty-state"><h3>Nessun turno configurato</h3></div>';
      } else {
        // Ordina per giorno settimana
        const sortedDays = Object.keys(grouped).sort((a, b) => {
          return giorni.indexOf(a) - giorni.indexOf(b);
        });

        sortedDays.forEach(day => {
          html += `<div style="margin-bottom: 20px;">
            <h3 style="font-size: 16px; margin-bottom: 10px; color: #667eea;">${day}</h3>
            <table>
              <thead>
                <tr>
                  <th>Dipendente</th>
                  <th>Orario</th>
                </tr>
              </thead>
              <tbody>`;

          grouped[day].forEach(t => {
            html += `<tr>
              <td>${t.nome} ${t.cognome}</td>
              <td>${t.oraInizio} - ${t.oraFine}</td>
            </tr>`;
          });

          html += '</tbody></table></div>';
        });
      }

      document.getElementById('turniTable').innerHTML = html;
    }
  </script>
</body>
</html>
